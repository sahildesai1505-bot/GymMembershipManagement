{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-dark text-white text-center py-3">
                    <h4 class="mb-0">🏋️ Member Login</h4>
                </div>

                <div class="card-body p-4">

                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-{{ message.tags }}">
                                {{ message }}
                            </div>

                        {% endfor %}

                    {% endif %}

                    <form method="POST">

                        {% csrf_token %}

                        <!-- Username -->

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter username"
                                required
                            >

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter password"
                                required
                            >

                        </div>


                        <!-- Login Button -->

                        <button
                            type="submit"
                            class="btn btn-dark w-100"
                        >
                            Login
                        </button>


                        <!-- Forgot Password -->

                        <div class="text-center mt-3">

                            <a
                                href="{% url 'password_reset' %}"
                                class="text-decoration-none"
                            >
                                Forgot Password?
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
