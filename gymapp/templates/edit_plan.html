{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1 class="fw-bold">
                ✏ Edit Membership Plan
            </h1>

            <p class="text-muted">
                Update {{ plan.name }}
            </p>

        </div>

        <a
            href="{% url 'plans_list' %}"
            class="btn btn-secondary"
        >
            ← Back to Plans
        </a>

    </div>


    <div class="card shadow-sm">

        <div class="card-header bg-dark text-white">

            <h4 class="mb-0">
                Edit Plan Information
            </h4>

        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}


                <!-- NAME -->

                <div class="mb-3">

                    <label class="form-label">
                        Plan Name *
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ plan.name }}"
                        required
                    >

                </div>


                <!-- FEE -->

                <div class="mb-3">

                    <label class="form-label">
                        Membership Fee *
                    </label>

                    <input
                        type="number"
                        name="fee"
                        class="form-control"
                        value="{{ plan.fee }}"
                        step="0.01"
                        min="0"
                        required
                    >

                </div>


                <!-- DURATION -->

                <div class="mb-3">

                    <label class="form-label">
                        Duration (Months) *
                    </label>

                    <input
                        type="number"
                        name="duration_months"
                        class="form-control"
                        value="{{ plan.duration_months }}"
                        min="1"
                        required
                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                    >{{ plan.description }}</textarea>

                </div>


                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        💾 Update Plan
                    </button>

                    <a
                        href="{% url 'plans_list' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
